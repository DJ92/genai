services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    command: >
      run --server
      --addr :8181
      /bundle/rego
      /bundle/data
    volumes:
      - ./policy/bundle:/bundle
    ports:
      - "8181:8181"

  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://agent:agent@postgres:5432/agentdb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started

  model-gateway:
    build: ./services/model_gateway
    env_file: .env
    ports:
      - "8001:8001"

  orchestrator:
    build: ./services/orchestrator
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://agent:agent@postgres:5432/agentdb
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

volumes:
  pgdata:
